networks:
  app_network:
    name: terraform-app-network
    
services:
  # ==========================================
  # PHP / APACHE
  # ==========================================
  php:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: terraform-php-apache
    restart: unless-stopped

    environment:
      DB_HOST: terraform-hello-aws-dev-mysql.cw32c80i4gi5.us-east-1.rds.amazonaws.com
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

    ports:
      - "${APP_PORT}:80"

    networks:
      - app_network

  # ==========================================
  # PHPMYADMIN
  # ==========================================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: terraform-phpmyadmin
    restart: unless-stopped

    environment:
      PMA_HOST: terraform-hello-aws-dev-mysql.cw32c80i4gi5.us-east-1.rds.amazonaws.com
      PMA_PORT: 3306

    ports:
      - "${PHPMYADMIN_PORT}:80"

    networks:
      - app_network