name: Terraform Master Pipeline

on:
  # El plan corre SIEMPRE de forma automática con cada push
  push:
    branches:
      - dev
      - pre

  # El apply es el único que se controla de forma manual con el botón
  workflow_dispatch:
    inputs:
      action:
        description: 'Selecciona la acción'
        required: true
        default: 'apply'
        type: choice
        options:
          - apply
      environment:
        description: 'Selecciona el ambiente'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

concurrency:
  group: terraform-${{ github.ref_name || inputs.environment }}
  cancel-in-progress: false

jobs:
  # ==========================================
  # JOB 1: PLAN (Automático 100% con el push)
  # ==========================================
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    env:
      TF_IN_AUTOMATION: true
      TF_VAR_aws_region: us-east-1
      TF_VAR_db_name: ${{ secrets.DB_NAME }}
      TF_VAR_db_username: ${{ secrets.DB_USER }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TARGET_ENV: ${{ github.ref_name == 'dev' && 'dev' || 'prod' }}

    defaults:
      run:
        working-directory: aws/environments/${{ env.TARGET_ENV }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.3

      - name: Terraform Init
        run: terraform init -upgrade

      - name: Terraform Plan
        run: |
          terraform plan \
            -lock-timeout=5m \
            -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-${{ env.TARGET_ENV }}
          path: aws/environments/${{ env.TARGET_ENV }}/tfplan

      - name: Upload App Source
        uses: actions/upload-artifact@v7
        with:
          name: app-source-${{ env.TARGET_ENV }}
          path: |
            app/
            docker-compose.yml

  # ==========================================
  # JOB 2: APPLY (Solo corre manual con el botón)
  # ==========================================
  terraform-apply:
    name: Terraform Apply & Deploy
    needs: terraform-plan
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'apply' }}
    runs-on: ubuntu-latest

    env:
      TF_IN_AUTOMATION: true
      TF_VAR_aws_region: us-east-1
      TF_VAR_db_name: ${{ secrets.DB_NAME }}
      TF_VAR_db_username: ${{ secrets.DB_USER }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TARGET_ENV: ${{ inputs.environment }}

    defaults:
      run:
        working-directory: aws/environments/${{ env.TARGET_ENV }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.3

      - name: Terraform Init
        run: terraform init

      - name: Download Terraform Plan
        uses: actions/download-artifact@v7
        with:
          name: tfplan-${{ env.TARGET_ENV }}
          path: aws/environments/${{ env.TARGET_ENV }}

      - name: Terraform Apply
        run: |
          terraform apply \
            -lock-timeout=5m \
            tfplan

      - name: Terraform Outputs
        run: terraform output

      - name: Download App Source
        uses: actions/download-artifact@v7
        with:
          name: app-source-${{ env.TARGET_ENV }}
          path: .

      - name: Package App Release
        run: |
          cd ../..
          zip -r app-release.zip app/ docker-compose.yml

      - name: Upload App Release to S3
        working-directory: .
        run: |
          aws s3 cp app-release.zip s3://terraform-state-ec2-lab-141553305029-us-east-1-an/app-releases/${{ env.TARGET_ENV }}/app-release.zip

      - name: Deploy CRUD via SSM
        run: |
          INSTANCE_ID=$(terraform output -raw instance_id)
          RDS_ENDPOINT=$(terraform output -raw rds_endpoint)
          
          APP_PORT=$([ "${{ env.TARGET_ENV }}" = "prod" ] && echo "8084" || echo "8082")
          PMA_PORT=$([ "${{ env.TARGET_ENV }}" = "prod" ] && echo "8085" || echo "8081")

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="[
              'set -e',
              'if ! cloud-init status --wait; then exit 1; fi',
              'mkdir -p /opt/app',
              'aws s3 cp s3://terraform-state-ec2-lab-141553305029-us-east-1-an/app-releases/${{ env.TARGET_ENV }}/app-release.zip /opt/app.zip',
              'cd /opt/app',
              'unzip -o /opt/app.zip',
              'echo DB_HOST=${RDS_ENDPOINT} > /opt/app/.env',
              'echo DB_NAME=${{ secrets.DB_NAME }} >> /opt/app/.env',
              'echo DB_USER=${{ secrets.DB_USER }} >> /opt/app/.env',
              'echo DB_PASSWORD=${{ secrets.DB_PASSWORD }} >> /opt/app/.env',
              'echo APP_PORT=${APP_PORT} >> /opt/app/.env',
              'echo PHPMYADMIN_PORT=${PMA_PORT} >> /opt/app/.env',
              'echo APP_ENV=$(echo ${{ env.TARGET_ENV }} | tr "[:lower:]" "[:upper:]") >> /opt/app/.env',
              'docker compose --env-file .env up -d --build'
            ]" \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v3
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "C0BV7BFRWUU",
              "text": "${{ job.status == 'success' && ':white_check_mark:' || ':x:' }} *Workflow Master (Apply - ${{ env.TARGET_ENV }})*\n*Estado:* ${{ job.status }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Ver logs>"
            }