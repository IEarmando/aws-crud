name: Terraform Master Pipeline

on:
  # El plan corre SIEMPRE de forma automática con cada push
  push:
    branches:
      - dev
      - main

  # El apply es el único que se controla de forma manual con el botón
  workflow_dispatch:
    inputs:
      action:
        description: 'Selecciona la acción'
        required: true
        default: 'apply'
        type: choice
        options:
          - apply
      environment:
        description: 'Selecciona el ambiente'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

concurrency:
  group: terraform-${{ github.ref_name || inputs.environment }}
  cancel-in-progress: false

jobs:
  # ==========================================
  # JOB 1: PLAN (Automático 100% con el push)
  # ==========================================
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    env:
      TF_IN_AUTOMATION: true
      TF_VAR_aws_region: us-east-1
      TF_VAR_db_name: ${{ secrets.DB_NAME }}
      TF_VAR_db_username: ${{ secrets.DB_USER }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TARGET_ENV: ${{ github.ref_name == 'dev' && 'dev' || 'prod' }}

    defaults:
      run:
        working-directory: aws/environments/${{ env.TARGET_ENV }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.3

      - name: Terraform Init
        run: terraform init -upgrade

      - name: Terraform Plan
        run: |
          terraform plan \
            -lock-timeout=5m \
            -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-${{ env.TARGET_ENV }}
          path: aws/environments/${{ env.TARGET_ENV }}/tfplan

      - name: Upload App Source
        uses: actions/upload-artifact@v7
        with:
          name: app-source-${{ env.TARGET_ENV }}
          path: |
            app/
            docker-compose.yml

  # ==========================================
  # JOB 2: APPLY (Solo corre manual con el botón)
  # ==========================================
  terraform-apply:
    name: Terraform Apply & Deploy
    needs: terraform-plan
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'apply' }}
    runs-on: ubuntu-latest

    env:
      TF_IN_AUTOMATION: true
      TF_VAR_aws_region: us-east-1
      TF_VAR_db_name: ${{ secrets.DB_NAME }}
      TF_VAR_db_username: ${{ secrets.DB_USER }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TARGET_ENV: ${{ inputs.environment }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.3

      - name: Terraform Init
        run: terraform -chdir=aws/environments/${{ env.TARGET_ENV }} init

      - name: Download Terraform Plan
        uses: actions/download-artifact@v7
        with:
          name: tfplan-${{ env.TARGET_ENV }}
          path: aws/environments/${{ env.TARGET_ENV }}

      - name: Terraform Apply
        run: |
          terraform -chdir=aws/environments/${{ env.TARGET_ENV }} apply \
            -lock-timeout=5m \
            tfplan

      - name: Terraform Outputs
        run: terraform -chdir=aws/environments/${{ env.TARGET_ENV }} output

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Setup SSH Key for Ansible
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > lab-key.pem
          chmod 600 lab-key.pem

      - name: Run Ansible Playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          # Inyectamos aquí los secretos que ya tienes en GitHub Actions:
          RDS_ENDPOINT: ${{ steps.tf-outputs.outputs.rds_endpoint }} # (O extraído con output)
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          APP_PORT: ${{ env.TARGET_ENV == 'prod' && '8084' || '8082' }}
          PHPMYADMIN_PORT: ${{ env.TARGET_ENV == 'prod' && '8085' || '8081' }}
          TARGET_ENV: ${{ env.TARGET_ENV }}
        run: |
          # Extraemos la IP pública recién creada por Terraform
          INSTANCE_IP=$(terraform -chdir=aws/environments/${{ env.TARGET_ENV }} output -raw public_ip)
          
          # También podemos exportar el RDS endpoint aquí si prefieres capturarlo al vuelo:
          export RDS_ENDPOINT=$(terraform -chdir=aws/environments/${{ env.TARGET_ENV }} output -raw rds_endpoint)

          # Generamos el inventario dinámicamente al vuelo
          echo "[web_server]" > hosts.ini
          echo "$INSTANCE_IP ansible_user=ec2-user ansible_ssh_private_key_file=./lab-key.pem" >> hosts.ini

          # Ejecutamos la automatización con Ansible heredando el entorno
          ansible-playbook -i hosts.ini setup-server.yml 

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v3
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "C0BV7BFRWUU",
              "text": "${{ job.status == 'success' && ':white_check_mark:' || ':x:' }} *CI/CD Workflow Master (Apply -${{ env.TARGET_ENV }})*\n*Repositorio:* ${{ github.repository }}\n*Estado:* ${{ job.status }}\n*Origen:* `${{ github.ref_name }}` -> *Destino:* `${{ env.TARGET_ENV }}`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Ver logs del despliegue>"
            }

            