name: Terraform Master Pipeline

on:
  push:
    branches:
      - dev

  workflow_dispatch:
    inputs:
      action:
        description: 'Selecciona la acción de Terraform'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
      environment:
        description: 'Selecciona el ambiente'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

concurrency:
  group: terraform-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  terraform-execution:
    name: Terraform Execution
    runs-on: ubuntu-latest

    env:
      TF_IN_AUTOMATION: true
      TF_VAR_aws_region: us-east-1
      # Si viene por push a dev usa dev, si viene por push a pre/main usa prod, o usa el input manual
      TARGET_ENV: ${{ github.event_name == 'push' && (github.ref_name == 'dev' && 'dev' || 'prod') || inputs.environment }}

    defaults:
      run:
        # Apuntamos dinámicamente a la carpeta correcta según el ambiente detectado
        working-directory: aws/environments/${{ env.TARGET_ENV }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.3

      - name: Terraform Init
        run: terraform init -upgrade

      # ==========================================
      # PASO 1: PLAN
      # ==========================================
      - name: Terraform Plan
        run: |
          terraform plan \
            -lock-timeout=5m \
            -out=tfplan

      # ==========================================
      # PASO 2: APPLY (Solo si elegiste 'apply')
      # ==========================================
      - name: Terraform Apply
        if: ${{ inputs.action == 'apply' }}
        run: |
          terraform apply \
            -lock-timeout=5m \
            tfplan

      - name: Terraform Outputs
        if: ${{ inputs.action == 'apply' }}
        run: terraform output

      # ==========================================
      # PASO 3: DESPLIEGUE DE LA APP (Solo en Apply)
      # ==========================================
      - name: Wait for EC2
        if: ${{ inputs.action == 'apply' }}
        run: |
          INSTANCE_ID=$(terraform output -raw instance_id)
          echo "Waiting for EC2 instance: $INSTANCE_ID"
          aws ec2 wait instance-status-ok --instance-ids "$INSTANCE_ID"

      - name: Package App Release
        if: ${{ inputs.action == 'apply' }}
        working-directory: .
        run: |
          zip -r app-release.zip app docker-compose.yml

      - name: Upload App Release to S3
        if: ${{ inputs.action == 'apply' }}
        working-directory: .
        run: |
          aws s3 cp app-release.zip \
            s3://terraform-state-ec2-lab-141553305029-us-east-1-an/app-releases/${{ inputs.environment }}/app-release.zip

      - name: Deploy CRUD via SSM
        if: ${{ inputs.action == 'apply' }}
        run: |
          INSTANCE_ID=$(terraform output -raw instance_id)
          RDS_ENDPOINT=$(terraform output -raw rds_endpoint)
          
          APP_PORT=$([ "${{ inputs.environment }}" = "prod" ] && echo "8084" || echo "8082")
          PMA_PORT=$([ "${{ inputs.environment }}" = "prod" ] && echo "8085" || echo "8081")
          DB_USR=$([ "${{ inputs.environment }}" = "prod" ] && echo "${{ secrets.PROD_DB_USER }}" || echo "${{ secrets.DB_USER }}")
          DB_PASS=$([ "${{ inputs.environment }}" = "prod" ] && echo "${{ secrets.PROD_DB_PASSWORD }}" || echo "${{ secrets.DB_PASSWORD }}")

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="[
              'set -e',
              'if ! cloud-init status --wait; then exit 1; fi',
              'mkdir -p /opt/app',
              'aws s3 cp s3://terraform-state-ec2-lab-141553305029-us-east-1-an/app-releases/${{ inputs.environment }}/app-release.zip /opt/app.zip',
              'cd /opt/app',
              'unzip -o /opt/app.zip',
              'echo DB_HOST=${RDS_ENDPOINT} > /opt/app/.env',
              'echo DB_NAME=${{ secrets.DB_NAME }} >> /opt/app/.env',
              'echo DB_USER=${DB_USR} >> /opt/app/.env',
              'echo DB_PASSWORD=${DB_PASS} >> /opt/app/.env',
              'echo APP_PORT=${APP_PORT} >> /opt/app/.env',
              'echo PHPMYADMIN_PORT=${PMA_PORT} >> /opt/app/.env',
              'echo APP_ENV=$(echo ${{ inputs.environment }} | tr "[:lower:]" "[:upper:]") >> /opt/app/.env',
              'docker compose --env-file .env up -d --build'
            ]" \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v3
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "C0BV7BFRWUU",
              "text": "${{ job.status == 'success' && ':white_check_mark:' || ':x:' }} *Workflow Master (${{ inputs.action }} - ${{ inputs.environment }})*\n*Estado:* ${{ job.status }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Ver logs>"
            }