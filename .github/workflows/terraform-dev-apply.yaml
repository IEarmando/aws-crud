name: 2. Terraform Apply (Manual)

on:
  workflow_dispatch:
    inputs:
      confirm_apply:
        description: '¿Estás seguro de aplicar los cambios a infraestructura? (Escribe SI)'
        required: true
        default: 'NO'
        type: choice
        options:
          - SI
          - NO
      environment:
        description: 'Selecciona el ambiente'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

jobs:
  apply:
    name: Apply Terraform & Deploy App
    if: ${{ inputs.confirm_apply == 'SI' }}
    runs-on: ubuntu-latest

    env:
      TF_IN_AUTOMATION: true
      TF_VAR_aws_region: us-east-1
      TF_VAR_db_name: ${{ secrets.DB_NAME }}
      TF_VAR_db_username: ${{ secrets.DB_USER }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

    defaults:
      run:
        working-directory: aws/environments/${{ inputs.environment }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.3

      - name: Terraform Init
        run: terraform init

      # Descargamos el plan que se guardó en el workflow automático
      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}
          path: aws/environments/${{ inputs.environment }}

      - name: Terraform Apply
        run: |
          terraform apply \
            -lock-timeout=5m \
            tfplan

      - name: Terraform Outputs
        run: terraform output

      # Descargamos el código de la app para empaquetarlo
      - name: Download App Source
        uses: actions/download-artifact@v4
        with:
          name: app-source-${{ inputs.environment }}
          path: .

      - name: Package App Release
        run: zip -r app-release.zip app docker-compose.yml

      - name: Upload App Release to S3
        run: |
          aws s3 cp app-release.zip s3://terraform-state-ec2-lab-141553305029-us-east-1-an/app-releases/${{ inputs.environment }}/app-release.zip

      - name: Deploy CRUD via SSM
        run: |
          INSTANCE_ID=$(terraform output -raw instance_id)
          RDS_ENDPOINT=$(terraform output -raw rds_endpoint)
          
          # Ajusta puertos dinámicos según el ambiente
          APP_PORT=$([ "${{ inputs.environment }}" = "prod" ] && echo "8084" || echo "8082")
          PMA_PORT=$([ "${{ inputs.environment }}" = "prod" ] && echo "8085" || echo "8081")

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="[
              'set -e',
              'if ! cloud-init status --wait; then exit 1; fi',
              'mkdir -p /opt/app',
              'aws s3 cp s3://terraform-state-ec2-lab-141553305029-us-east-1-an/app-releases/${{ inputs.environment }}/app-release.zip /opt/app.zip',
              'cd /opt/app',
              'unzip -o /opt/app.zip',
              'echo DB_HOST=${RDS_ENDPOINT} > /opt/app/.env',
              'echo DB_NAME=${{ secrets.DB_NAME }} >> /opt/app/.env',
              'echo DB_USER=${{ secrets.DB_USER }} >> /opt/app/.env',
              'echo DB_PASSWORD=${{ secrets.DB_PASSWORD }} >> /opt/app/.env',
              'echo APP_PORT='${APP_PORT}' >> /opt/app/.env',
              'echo PHPMYADMIN_PORT='${PMA_PORT}' >> /opt/app/.env',
              'echo APP_ENV=$(echo ${{ inputs.environment }} | tr \"[:lower:]\" \"[:upper:]\") >> /opt/app/.env',
              'docker compose --env-file .env up -d --build'
            ]" \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"