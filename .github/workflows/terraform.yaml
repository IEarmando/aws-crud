name: Terraform AWS EC2 Pipeline

on:
  push:
    branches:
      - pre

concurrency:
  group: terraform-aws-pre
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy AWS EC2 with Terraform

    runs-on: ubuntu-latest

    env:
      TF_IN_AUTOMATION: true
      TF_VAR_aws_region: us-east-1

    defaults:
      run:
        working-directory: aws

    steps:
      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout Code
        uses: actions/checkout@v6


      # =========================================================
      # OLD STATE - GITHUB CACHE
      # SOLO PARA ESTA MIGRACION
      # =========================================================

      - name: Restore Previous Terraform State
        id: terraform-state
        uses: actions/cache/restore@v6
        with:
          path: |
            aws/terraform.tfstate
            aws/terraform.tfstate.backup
          key: terraform-state-aws-pre-${{ github.run_id }}
          restore-keys: |
            terraform-state-aws-pre-

      - name: Check Previous Terraform State
        working-directory: .
        run: |
          if [ -f aws/terraform.tfstate ]; then
            echo "======================================"
            echo "Previous terraform.tfstate FOUND"
            echo "State will be migrated to S3"
            echo "======================================"
          else
            echo "ERROR: Previous terraform.tfstate was not found"
            echo "Stopping migration to avoid creating a new state"
            exit 1
          fi


      # =========================================================
      # AWS AUTHENTICATION
      # =========================================================

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Verify AWS Connection
        run: |
          echo "Checking AWS authentication..."
          aws sts get-caller-identity


      # =========================================================
      # TERRAFORM
      # =========================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8


      # =========================================================
      # MIGRATE LOCAL/CACHED STATE -> S3
      # =========================================================

      - name: Terraform Init and Migrate State to S3
        run: |
          terraform init \
            -migrate-state \
            -force-copy \
            -input=false


      # =========================================================
      # VERIFY REMOTE STATE
      # =========================================================

      - name: Verify Remote Terraform State
        run: |
          echo "======================================"
          echo "RESOURCES IN REMOTE S3 STATE"
          echo "======================================"

          terraform state list


      # =========================================================
      # TERRAFORM CHECKS
      # =========================================================

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate


      # =========================================================
      # PLAN WITH STATE LOCKING
      # =========================================================

      - name: Terraform Plan
        run: |
          terraform plan \
            -lock-timeout=5m \
            -out=tfplan


      # =========================================================
      # APPLY WITH STATE LOCKING
      # =========================================================

      - name: Terraform Apply
        run: |
          terraform apply \
            -lock-timeout=5m \
            tfplan


      # =========================================================
      # OUTPUTS
      # =========================================================

      - name: Terraform Outputs
        run: |
          echo "======================================"
          echo "AWS INFRASTRUCTURE"
          echo "======================================"

          terraform output

          echo ""
          echo "Website:"
          terraform output -raw website_url


      # =========================================================
      # WAIT FOR EC2
      # =========================================================

      - name: Wait for EC2
        run: |
          INSTANCE_ID=$(terraform output -raw instance_id)

          echo "Waiting for EC2 instance: $INSTANCE_ID"

          aws ec2 wait instance-status-ok \
            --instance-ids "$INSTANCE_ID"

          echo "EC2 instance is healthy"


      # =========================================================
      # TEST WEBSITE
      # =========================================================

      - name: Test Website
        run: |
          WEB_URL=$(terraform output -raw website_url)

          echo "Testing: $WEB_URL"

          for i in {1..30}; do

            if curl --fail --silent "$WEB_URL" > /dev/null; then
              echo "======================================"
              echo "WEBSITE IS UP"
              echo "$WEB_URL"
              echo "======================================"
              exit 0
            fi

            echo "Waiting for Apache... attempt $i/30"
            sleep 10

          done

          echo "Website did not respond"
          exit 1


      # =========================================================
      # SLACK
      # =========================================================

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v3
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "C0BV7BFRWUU",
              "text": "${{ job.status == 'success' && ':white_check_mark:' || ':x:' }} *${{ github.workflow }}*\n*Repositorio:* ${{ github.repository }}\n*Estado:* ${{ job.status }}\n*Branch:* `${{ github.ref_name }}`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Ver pipeline>"
            }