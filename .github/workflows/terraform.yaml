name: Terraform AWS EC2 Pipeline

on:
  push:
    branches:
      - pre

concurrency:
  group: terraform-aws-pre
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy AWS EC2 with Terraform

    runs-on: ubuntu-latest

    env:
      TF_IN_AUTOMATION: true
      TF_VAR_aws_region: us-east-1

    defaults:
      run:
        working-directory: aws

    steps:

      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Restore Terraform State
        id: terraform-state
        uses: actions/cache/restore@v6
        with:
          path: |
            aws/terraform.tfstate
            aws/terraform.tfstate.backup
          key: terraform-state-aws-pre-${{ github.run_id }}
          restore-keys: |
            terraform-state-aws-pre-


      - name: Check Previous Terraform State
        working-directory: .
        run: |
          if [ -f aws/terraform.tfstate ]; then
            echo "Previous AWS terraform.tfstate FOUND"
          else
            echo "No previous AWS terraform.tfstate found"
            echo "This is the first AWS deployment"
          fi


      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1


      - name: Verify AWS Connection
        run: |
          echo "Checking AWS authentication..."
          aws sts get-caller-identity


      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8


      - name: Terraform Init
        run: terraform init


      - name: Terraform Format
        run: terraform fmt -check


      - name: Terraform Validate
        run: terraform validate


      - name: Show Previous Terraform Resources
        if: steps.terraform-state.outputs.cache-matched-key != ''
        run: |
          echo "======================================"
          echo "RESOURCES FROM PREVIOUS STATE"
          echo "======================================"

          terraform state list


      - name: Terraform Plan
        run: |
          terraform plan -out=tfplan


      - name: Terraform Apply
        run: |
          terraform apply -auto-approve tfplan


      - name: Save Terraform State
        if: ${{ always() && hashFiles('aws/terraform.tfstate') != '' }}
        uses: actions/cache/save@v6
        with:
          path: |
            aws/terraform.tfstate
            aws/terraform.tfstate.backup
          key: terraform-state-aws-pre-${{ github.run_id }}


      - name: Terraform Outputs
        run: |
          echo "======================================"
          echo "AWS INFRASTRUCTURE"
          echo "======================================"

          terraform output

          echo ""
          echo "Website:"
          terraform output -raw website_url


      - name: Wait for EC2
        run: |
          INSTANCE_ID=$(terraform output -raw instance_id)

          echo "Waiting for EC2 instance: $INSTANCE_ID"

          aws ec2 wait instance-status-ok \
            --instance-ids "$INSTANCE_ID"

          echo "EC2 instance is healthy"


      - name: Test Website
        run: |
          WEB_URL=$(terraform output -raw website_url)

          echo "Testing: $WEB_URL"

          for i in {1..30}; do

            if curl --fail --silent "$WEB_URL" > /dev/null; then
              echo "======================================"
              echo "WEBSITE IS UP"
              echo "$WEB_URL"
              echo "======================================"
              exit 0
            fi

            echo "Waiting for Apache... attempt $i/30"
            sleep 10

          done

          echo "Website did not respond"
          exit 1


      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v3
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "C0BV7BFRWUU",
              "text": "${{ job.status == 'success' && ':white_check_mark:' || ':x:' }} *${{ github.workflow }}*\n*Repositorio:* ${{ github.repository }}\n*Estado:* ${{ job.status }}\n*Branch:* `${{ github.ref_name }}`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Ver pipeline>"
            }