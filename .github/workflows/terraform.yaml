name: Terraform AWS EC2 Pipeline

on:
  push:
    branches:
      - pre

concurrency:
  group: terraform-aws-pre
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy AWS EC2 with Terraform

    runs-on: ubuntu-latest

    env:
      TF_IN_AUTOMATION: true
      TF_VAR_aws_region: us-east-1

    defaults:
      run:
        working-directory: aws

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Verify AWS Connection
        run: |
          echo "Checking AWS authentication..."
          aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Show Remote Terraform Resources
        run: |
          echo "======================================"
          echo "RESOURCES FROM REMOTE S3 STATE"
          echo "======================================"
          terraform state list

      - name: Terraform Plan
        run: |
          terraform plan \
            -lock-timeout=5m \
            -out=tfplan

      - name: Terraform Apply
        run: |
          terraform apply \
            -lock-timeout=5m \
            tfplan

      - name: Terraform Outputs
        run: |
          echo "======================================"
          echo "AWS INFRASTRUCTURE"
          echo "======================================"

          terraform output

          echo ""
          echo "Website:"
          terraform output -raw website_url

      - name: Wait for EC2
        run: |
          INSTANCE_ID=$(terraform output -raw instance_id)

          echo "Waiting for EC2 instance: $INSTANCE_ID"

          aws ec2 wait instance-status-ok \
            --instance-ids "$INSTANCE_ID"

          echo "EC2 instance is healthy"

      - name: Package App Release
        working-directory: .
        run: |
          zip -r app-release.zip app docker-compose.yml

      - name: Upload App Release to S3
        working-directory: .
        run: |
          aws s3 cp app-release.zip \
            s3://terraform-state-ec2-lab-141553305029-us-east-1-an/app-releases/pre/app-release.zip

      - name: Deploy CRUD via SSM
        run: |
          INSTANCE_ID=$(terraform output -raw instance_id)

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="[
              'aws s3 cp s3://terraform-state-ec2-lab-141553305029-us-east-1-an/app-releases/pre/app-release.zip /opt/app.zip',
              'cd /opt/app && unzip -o /opt/app.zip',
              'cat > /opt/app/.env <<EOF
              DB_NAME=${{ secrets.DB_NAME }}
              DB_USER=${{ secrets.DB_USER }}
              DB_PASSWORD=${{ secrets.DB_PASSWORD }}
              DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}
              APP_PORT=8082
              PHPMYADMIN_PORT=8081
              EOF',
              'cd /opt/app && docker compose --env-file .env up -d --build'
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "Esperando resultado del comando $COMMAND_ID..."
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

      - name: Test CRUD
        run: |
          WEB_URL=$(terraform output -raw website_url)

          echo "Testing: $WEB_URL"

          for i in {1..30}; do
            if curl --fail --silent "$WEB_URL" > /dev/null; then
              echo "======================================"
              echo "CRUD IS UP"
              echo "$WEB_URL"
              echo "======================================"
              exit 0
            fi

            echo "Waiting for containers... attempt $i/30"
            sleep 10
          done

          echo "CRUD did not respond"
          exit 1

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v3
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "C0BV7BFRWUU",
              "text": "${{ job.status == 'success' && ':white_check_mark:' || ':x:' }} *${{ github.workflow }}*\n*Repositorio:* ${{ github.repository }}\n*Estado:* ${{ job.status }}\n*Origen:* `${{ github.event.pull_request.head.ref }}` -> *Destino:* `${{ github.event.pull_request.base.ref }}`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Ver logs del despliegue>"
            }