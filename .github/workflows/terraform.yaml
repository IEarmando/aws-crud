name: Terraform Docker Pipeline

on:
  push:
    branches:
      - pre

concurrency:
  group: terraform-pre
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy Terraform Docker
    runs-on: ubuntu-latest

    env:
      TF_IN_AUTOMATION: true
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_db_root_password: ${{ secrets.DB_ROOT_PASSWORD }}
      TF_VAR_image_name: ${{ secrets.DOCKER_USERNAME }}/terraform-php-apache:pre

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Restore Terraform State
        id: terraform-state
        uses: actions/cache/restore@v4
        with:
          path: |
            terraform.tfstate
            terraform.tfstate.backup
          key: terraform-state-pre-${{ github.run_id }}
          restore-keys: |
            terraform-state-pre-

      - name: Check Previous Terraform State
        run: |
          if [ -f terraform.tfstate ]; then
            echo "Previous terraform.tfstate FOUND"
          else
            echo "No previous terraform.tfstate found"
            echo "First execution"
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push PHP Apache Image
        uses: docker/build-push-action@v7
        with:
          context: ./app
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/terraform-php-apache:pre
          platforms: linux/amd64
          provenance: false
          sbom: false

      - name: Pull Application Image
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/terraform-php-apache:pre

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform State Diff
        if: steps.terraform-state.outputs.cache-matched-key != ''
        run: |
          echo "======================================"
          echo "CHANGES AGAINST PREVIOUS STATE"
          echo "======================================"
          terraform plan -refresh=false -no-color

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Save Terraform State
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            terraform.tfstate
            terraform.tfstate.backup
          key: terraform-state-pre-${{ github.run_id }}

      - name: Verify Containers
        run: |
          docker ps
          terraform output

      - name: Test PHP Apache
        run: |
          WEB_URL=$(terraform output -json services | jq -r '.web.url')

          echo "Testing: $WEB_URL"

          for i in {1..10}; do
            if curl --fail --silent "$WEB_URL"; then
              echo "PHP Apache OK"
              exit 0
            fi

            echo "Waiting for PHP Apache..."
            sleep 5
          done

          exit 1

      - name: Test phpMyAdmin
        run: |
          PHPMYADMIN_URL=$(terraform output -json services | jq -r '.phpmyadmin.url')

          echo "Testing: $PHPMYADMIN_URL"

          for i in {1..10}; do
            if curl --fail --silent "$PHPMYADMIN_URL" > /dev/null; then
              echo "phpMyAdmin OK"
              exit 0
            fi

            echo "Waiting for phpMyAdmin..."
            sleep 5
          done

          exit 1

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v3
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "C0BV7BFRWUU",
              "text": "${{ job.status == 'success' && ':white_check_mark:' || ':x:' }} *${{ github.workflow }}*\n*Repositorio:* ${{ github.repository }}\n*Estado:* ${{ job.status }}\n*Branch:* `${{ github.ref_name }}`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Ver logs del despliegue>"
            }